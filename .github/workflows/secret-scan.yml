name: secret-scan

# Defence in depth for the custom-upstream feature: the gateway reads
# ~/.workbuddy/models.json locally, so no key should ever be in the tree -
# this job makes a leaked credential fail CI instead of relying on reviews.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential patterns
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          files = subprocess.run(["git", "ls-files"], capture_output=True,
                                 text=True).stdout.split()
          patterns = {
              "openai-style key": r"sk-[A-Za-z0-9_-]{16,}",
              "github token": r"gh[pousr]_[A-Za-z0-9]{20,}",
              "github fine-grained PAT": r"github_pat_[A-Za-z0-9_]{20,}",
              "aws access key id": r"AKIA[0-9A-Z]{16}",
              "slack token": r"xox[baprs]-[A-Za-z0-9-]{10,}",
              "private key block": r"-----BEGIN [A-Z ]*PRIVATE KEY-----",
          }
          # Placeholder credentials used by offline test fixtures only:
          # _test_custom_models.py fake upstream key, _test_activity_history.py
          # redaction fixture, _test_upstream_pool.py synthetic PEM.
          allowlist = {"sk-custom-test-abcdef123456",
                       "sk-live-abcdefghijklmnopqrst"}

          hits = []
          for path in files:
              try:
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      text = fh.read()
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  for match in re.finditer(pattern, text):
                      if match.group(0) in allowlist:
                          continue
                      if label == "private key block" \
                              and path == "tests/_test_upstream_pool.py":
                          continue
                      hits.append("%s: %s (%s...)" % (path, label,
                                                      match.group(0)[:8]))
          if hits:
              print("POTENTIAL SECRETS FOUND:")
              for hit in hits:
                  print("  " + hit)
              sys.exit(1)
          print("secret scan clean over %d tracked files" % len(files))
          PY
